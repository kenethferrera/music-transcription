name: Build, Test & Publish to GHCR

on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Run Automated Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Pytest
        env:
          STORAGE_PROVIDER: local
          STT_PROVIDER: mock
          ENVIRONMENT: test
          PYTHONPATH: .
        run: |
          pytest -v tests/

  build-and-publish:
    name: Build & Publish Production Images
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: music-transcription-api
            dockerfile: docker/api/Dockerfile
          - name: music-audio-separation
            dockerfile: docker/demucs/Dockerfile
          - name: music-music-transcription
            dockerfile: docker/muscriptor/Dockerfile
          - name: music-arrangement
            dockerfile: docker/arrangement/Dockerfile
          - name: music-export
            dockerfile: docker/export/Dockerfile
          - name: music-frontend
            dockerfile: docker/frontend/Dockerfile
          - name: music-transcription-runpod
            dockerfile: deployment/runpod/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare lowercase image repository name
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_BASE=${{ env.REGISTRY }}/${REPO_LOWER}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}/${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
